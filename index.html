<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>АРМ Клиента | Орби CRM</title>
    <!-- Подключаем SheetJS для работы с Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            line-height: 1.4;
        }

        /* --- Хедер в стиле CRM --- */
        .app-header {
            background: white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.03);
            padding: 0 32px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(2px);
            border-bottom: 1px solid #e9edf2;
        }

        .header-group {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .dropdown {
            position: relative;
        }

        .menu-btn {
            background: #f1f5f9;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 40px;
            color: #0f172a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }

        .menu-btn:hover {
            background: #e6edf4;
            transform: translateY(-1px);
        }

        .menu-btn:active {
            transform: translateY(1px);
        }

        .dropdown-content {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: white;
            min-width: 210px;
            border-radius: 20px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1), 0 2px 4px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.2s ease;
            border: 1px solid #eef2f6;
        }

        .dropdown-content.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-content a {
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 450;
            transition: background 0.15s;
            border-left: 3px solid transparent;
            cursor: pointer;
        }

        .dropdown-content a:hover {
            background: #f8fafc;
            border-left-color: #3b82f6;
            color: #0f172a;
        }

        .org-name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1e293b 0%, #2d3a4e 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .time-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 500;
            background: #f1f5f9;
            padding: 8px 18px;
            border-radius: 60px;
            color: #0f172a;
        }

        .main-content {
            max-width: 1400px;
            margin: 28px auto;
            padding: 0 28px;
        }

        .dashboard-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.05);
            padding: 28px 32px;
            transition: all 0.2s;
            border: 1px solid #edf2f7;
        }

        .section-title {
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid #3b82f6;
            padding-left: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .data-table th {
            text-align: left;
            padding: 14px 12px;
            background-color: #f8fafc;
            font-weight: 600;
            color: #334155;
            border-bottom: 1px solid #e2e8f0;
        }

        .data-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #ecf3f9;
            color: #1e293b;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .badge {
            background: #eef2ff;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
        }

        .calendar-container {
            background: #ffffff;
            border-radius: 24px;
            overflow-x: auto;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .month-year {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f172a;
        }

        .cal-nav {
            display: flex;
            gap: 12px;
        }

        .cal-nav button {
            background: #f1f5f9;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
        }

        .cal-nav button:hover {
            background: #e2e8f0;
        }

        .calendar-weekdays, .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-weekdays div {
            font-weight: 600;
            padding: 12px 0;
            color: #475569;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .calendar-days {
            margin-top: 8px;
        }

        .cal-day {
            background: #f9fbfd;
            padding: 12px 6px;
            border-radius: 16px;
            font-weight: 500;
            cursor: default;
            border: 1px solid #eef2f8;
        }

        .cal-day.today {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 2px 6px rgba(59,130,246,0.2);
        }

        .cal-day.other-month {
            color: #94a3b8;
            background: #fefefe;
        }

        /* Стили для импорта */
        .import-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .file-label {
            background: #3b82f6;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            font-size: 1rem;
        }
        .file-label:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        #excelInput {
            display: none;
        }
        .import-table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }
        .import-info {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #4b5563;
        }

        /* Стили для калькулятора */
        .calculator {
            max-width: 380px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #edf2f7;
        }
        .calc-display {
            background: #f8fafc;
            padding: 28px 20px;
            text-align: right;
            font-size: 2.8rem;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
            color: #0f172a;
            border-bottom: 1px solid #eef2f8;
            word-wrap: break-word;
            word-break: break-all;
            min-height: 110px;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 24px;
            background: #ffffff;
        }
        .calc-btn {
            background: #f1f5f9;
            border: none;
            border-radius: 28px;
            padding: 16px 8px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.1s ease;
            font-family: inherit;
            box-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }
        .calc-btn:active {
            transform: scale(0.96);
            background: #e2e8f0;
        }
        .calc-btn.operator {
            background: #eef2ff;
            color: #2563eb;
            font-weight: 600;
        }
        .calc-btn.equals {
            background: #3b82f6;
            color: white;
        }
        .calc-btn.clear {
            background: #fee2e2;
            color: #dc2626;
        }
        .calc-btn.backspace {
            background: #f1f5f9;
            font-size: 1.2rem;
        }
        @media (max-width: 500px) {
            .calc-buttons {
                gap: 6px;
                padding: 18px;
            }
            .calc-btn {
                padding: 14px 4px;
                font-size: 1.1rem;
            }
            .calc-display {
                font-size: 2rem;
                padding: 20px 16px;
            }
        }

        @media (max-width: 700px) {
            .app-header {
                padding: 0 18px;
                height: 64px;
            }
            .header-group {
                gap: 20px;
            }
            .org-name {
                font-size: 1.2rem;
            }
            .time-box {
                font-size: 0.9rem;
                padding: 5px 12px;
            }
            .dashboard-card {
                padding: 18px;
            }
            .section-title {
                font-size: 1.4rem;
            }
            .data-table th, .data-table td {
                padding: 8px 6px;
                font-size: 0.8rem;
            }
        }

        footer {
            text-align: center;
            padding: 28px;
            font-size: 0.75rem;
            color: #6c7a91;
            border-top: 1px solid #eef2f8;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-group">
        <div class="dropdown" id="dropdownMenu">
            <button class="menu-btn" id="menuButton">
                ☰ Меню
            </button>
            <div class="dropdown-content" id="dropdownContent">
                <a data-section="calendar">📅 Календарь</a>
                <a data-section="deals">💰 Сделки</a>
                <a data-section="goods">📦 Товары и услуги</a>
                <a data-section="contacts">👥 Контакты</a>
                <a data-section="import">📂 Импорт Excel</a>
                <a data-section="calculator">🧮 Калькулятор</a>
                <a data-section="exit">✖ Выход</a>
            </div>
        </div>
        <div class="org-name">Орби</div>
    </div>
    <div class="time-box" id="liveClock">--:--:--</div>
</header>

<main class="main-content">
    <div class="dashboard-card" id="dynamicContent">
        <div style="text-align: center; padding: 40px;">Загрузка интерфейса...</div>
    </div>
</main>
<footer>
    Орби CRM — клиентский портал | Лёгкая работа с бизнесом
</footer>

<script>
    // ---------- ДАННЫЕ ДЛЯ ДЕМОНСТРАЦИИ (имитация АРМ клиента) ----------
    const dealsData = [
        { id: 1, name: "Внедрение CRM", amount: "1 250 000 ₽", stage: "Переговоры", date: "2025-07-20" },
        { id: 2, name: "Лицензия на 12 мес", amount: "340 000 ₽", stage: "Счёт выставлен", date: "2025-06-15" },
        { id: 3, name: "Расширение функционала", amount: "850 000 ₽", stage: "Закрыто", date: "2025-05-10" },
    ];

    const goodsData = [
        { name: "Базовый тариф CRM", price: "12 900 ₽", unit: "месяц", desc: "До 10 пользователей" },
        { name: "Профессиональный тариф", price: "29 900 ₽", unit: "месяц", desc: "Расширенная аналитика" },
        { name: "Интеграция с 1С", price: "49 000 ₽", unit: "ед.", desc: "Настройка под ключ" },
        { name: "Обучающий курс", price: "15 000 ₽", unit: "курс", desc: "Видео-уроки + методичка" },
    ];

    const contactsData = [
        { name: "Анна Крылова", position: "Руководитель отдела", phone: "+7 (912) 345-67-89", email: "a.krylova@example.com" },
        { name: "Дмитрий Волков", position: "Менеджер по закупкам", phone: "+7 (965) 123-45-67", email: "d.volkov@example.com" },
        { name: "Елена Соболева", position: "Финансовый директор", phone: "+7 (903) 987-65-43", email: "e.soboleva@example.com" },
    ];

    // ---------- Утилиты ----------
    function formatDateToYMD(date) {
        let y = date.getFullYear();
        let m = String(date.getMonth() + 1).padStart(2, '0');
        let d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    // ---------- Календарь ----------
    let currentCalendarYear = new Date().getFullYear();
    let currentCalendarMonth = new Date().getMonth();

    function renderCalendar(year, month) {
        const firstDayOfMonth = new Date(year, month, 1);
        const startWeekday = firstDayOfMonth.getDay();
        let startOffset = startWeekday === 0 ? 6 : startWeekday - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevMonthDays = new Date(year, month, 0).getDate();
        const calendarDays = [];

        for (let i = startOffset - 1; i >= 0; i--) {
            calendarDays.push({ day: prevMonthDays - i, isCurrentMonth: false });
        }
        for (let i = 1; i <= daysInMonth; i++) {
            calendarDays.push({ day: i, isCurrentMonth: true });
        }
        const remaining = 42 - calendarDays.length;
        for (let i = 1; i <= remaining; i++) {
            calendarDays.push({ day: i, isCurrentMonth: false });
        }

        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const weekdaysShort = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        const today = new Date();
        const todayYMD = formatDateToYMD(today);

        let html = `
            <div class="calendar-container">
                <div class="calendar-header">
                    <div class="month-year">${monthNames[month]} ${year}</div>
                    <div class="cal-nav">
                        <button class="prev-month-btn">◀ Назад</button>
                        <button class="next-month-btn">Вперед ▶</button>
                    </div>
                </div>
                <div class="calendar-weekdays">
                    ${weekdaysShort.map(day => `<div>${day}</div>`).join('')}
                </div>
                <div class="calendar-days">
        `;
        for (let i = 0; i < calendarDays.length; i++) {
            const cell = calendarDays[i];
            const dayNum = cell.day;
            const isCurrent = cell.isCurrentMonth;
            let cellDate = null;
            if (isCurrent) {
                cellDate = new Date(year, month, dayNum);
            } else if (dayNum > 15) {
                let prevMonth = month === 0 ? 11 : month - 1;
                let prevYear = month === 0 ? year - 1 : year;
                cellDate = new Date(prevYear, prevMonth, dayNum);
            } else {
                let nextMonth = month === 11 ? 0 : month + 1;
                let nextYear = month === 11 ? year + 1 : year;
                cellDate = new Date(nextYear, nextMonth, dayNum);
            }
            let isToday = false;
            if (cellDate && isCurrent) {
                const ymd = formatDateToYMD(cellDate);
                if (ymd === todayYMD) isToday = true;
            }
            let additionalClass = '';
            if (!isCurrent) additionalClass = 'other-month';
            if (isToday) additionalClass += ' today';
            html += `<div class="cal-day ${additionalClass}">${dayNum}</div>`;
        }
        html += `</div></div>`;
        return html;
    }

    function refreshCalendar(container) {
        if (!container) return;
        container.innerHTML = renderCalendar(currentCalendarYear, currentCalendarMonth);
        const prevBtn = container.querySelector('.prev-month-btn');
        const nextBtn = container.querySelector('.next-month-btn');
        if (prevBtn) {
            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                let newMonth = currentCalendarMonth - 1;
                let newYear = currentCalendarYear;
                if (newMonth < 0) { newMonth = 11; newYear--; }
                currentCalendarMonth = newMonth;
                currentCalendarYear = newYear;
                refreshCalendar(container);
            });
        }
        if (nextBtn) {
            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                let newMonth = currentCalendarMonth + 1;
                let newYear = currentCalendarYear;
                if (newMonth > 11) { newMonth = 0; newYear++; }
                currentCalendarMonth = newMonth;
                currentCalendarYear = newYear;
                refreshCalendar(container);
            });
        }
    }

    // ---------- Импорт Excel (SheetJS) ----------
    let importedData = null;

    function renderImportSection() {
        const contentDiv = document.getElementById('dynamicContent');
        contentDiv.innerHTML = `
            <div class="section-title">📂 Импорт данных из Excel</div>
            <div class="import-area">
                <label class="file-label" for="excelInput">
                    📎 Выберите файл Excel (.xlsx, .xls)
                </label>
                <input type="file" id="excelInput" accept=".xlsx, .xls, .csv">
                <div class="import-info">Поддерживаются файлы Excel (xlsx, xls). Данные первого листа будут отображены ниже.</div>
            </div>
            <div id="excelPreview" class="import-table-wrapper">
                <p style="color: #6c7a91; text-align:center;">Файл не загружен</p>
            </div>
        `;

        const fileInput = document.getElementById('excelInput');
        fileInput.addEventListener('change', handleExcelUpload);
    }

    function handleExcelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const previewDiv = document.getElementById('excelPreview');
        previewDiv.innerHTML = '<p style="text-align:center;">⏳ Чтение файла...</p>';

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
            if (!rows || rows.length === 0) {
                previewDiv.innerHTML = '<p style="color: #dc2626;">Файл пуст или не содержит данных.</p>';
                return;
            }
            importedData = rows;
            displayExcelTable(rows, previewDiv);
        };
        reader.onerror = function() {
            previewDiv.innerHTML = '<p style="color: #dc2626;">Ошибка чтения файла. Попробуйте другой файл.</p>';
        };
        reader.readAsArrayBuffer(file);
    }

    function displayExcelTable(rows, container) {
        if (!rows.length) {
            container.innerHTML = '<p>Нет данных для отображения</p>';
            return;
        }
        let html = '<table class="data-table" style="min-width: 500px;"><thead><tr>';
        const headerRow = rows[0];
        for (let i = 0; i < headerRow.length; i++) {
            let cellValue = (headerRow[i] !== undefined && headerRow[i] !== null) ? String(headerRow[i]) : '';
            html += `<th>${escapeHtml(cellValue) || `Колонка ${i+1}`}</th>`;
        }
        html += '</tr></thead><tbody>';
        for (let r = 1; r < rows.length; r++) {
            const row = rows[r];
            html += '<tr>';
            for (let c = 0; c < headerRow.length; c++) {
                let cell = (c < row.length && row[c] !== undefined && row[c] !== null) ? String(row[c]) : '';
                html += `<td>${escapeHtml(cell)}</td>`;
            }
            if (row.length > headerRow.length) {
                for (let c = headerRow.length; c < row.length; c++) {
                    html += `<td>${escapeHtml(String(row[c]))}</td>`;
                }
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        html += `<div class="import-info">✅ Загружено строк: ${rows.length - 1}, колонок: ${headerRow.length}</div>`;
        container.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ---------- Калькулятор (безопасная логика) ----------
    let calcState = {
        current: '0',     // отображаемое число
        prev: null,
        operation: null,
        waitingForOperand: false
    };

    function updateDisplay(displayElement) {
        if (displayElement) displayElement.textContent = calcState.current;
    }

    function inputDigit(digit, displayElement) {
        if (calcState.waitingForOperand) {
            calcState.current = digit;
            calcState.waitingForOperand = false;
        } else {
            calcState.current = calcState.current === '0' ? digit : calcState.current + digit;
        }
        updateDisplay(displayElement);
    }

    function inputDecimal(displayElement) {
        if (calcState.waitingForOperand) {
            calcState.current = '0.';
            calcState.waitingForOperand = false;
            updateDisplay(displayElement);
            return;
        }
        if (!calcState.current.includes('.')) {
            calcState.current += '.';
            updateDisplay(displayElement);
        }
    }

    function toggleSign(displayElement) {
        const val = parseFloat(calcState.current);
        if (isNaN(val)) return;
        calcState.current = String(val * -1);
        updateDisplay(displayElement);
    }

    function backspace(displayElement) {
        if (calcState.waitingForOperand) return;
        if (calcState.current.length === 1 || (calcState.current.length === 2 && calcState.current.startsWith('-'))) {
            calcState.current = '0';
        } else {
            calcState.current = calcState.current.slice(0, -1);
        }
        updateDisplay(displayElement);
    }

    function clearAll(displayElement) {
        calcState.current = '0';
        calcState.prev = null;
        calcState.operation = null;
        calcState.waitingForOperand = false;
        updateDisplay(displayElement);
    }

    function performOperation(nextOp, displayElement) {
        const inputVal = parseFloat(calcState.current);
        if (isNaN(inputVal)) return;

        if (calcState.prev !== null && calcState.operation !== null && !calcState.waitingForOperand) {
            let result;
            const prevVal = calcState.prev;
            switch (calcState.operation) {
                case '+': result = prevVal + inputVal; break;
                case '-': result = prevVal - inputVal; break;
                case '*': result = prevVal * inputVal; break;
                case '/': 
                    if (inputVal === 0) {
                        clearAll(displayElement);
                        calcState.current = 'Ошибка';
                        updateDisplay(displayElement);
                        calcState.prev = null;
                        calcState.operation = null;
                        calcState.waitingForOperand = true;
                        return;
                    }
                    result = prevVal / inputVal;
                    break;
                default: return;
            }
            calcState.current = String(result);
            calcState.prev = null;
            calcState.operation = null;
            calcState.waitingForOperand = true;
            updateDisplay(displayElement);
        }

        if (nextOp) {
            calcState.prev = parseFloat(calcState.current);
            calcState.operation = nextOp;
            calcState.waitingForOperand = true;
        } else {
            // равно - уже всё посчитано выше
            calcState.waitingForOperand = true;
        }
    }

    function evaluate(displayElement) {
        if (calcState.prev !== null && calcState.operation !== null && !calcState.waitingForOperand) {
            performOperation(null, displayElement);
        }
    }

    function initCalculator(container) {
        // Создаём HTML структуру калькулятора
        container.innerHTML = `
            <div class="calculator">
                <div class="calc-display" id="calcDisplay">0</div>
                <div class="calc-buttons">
                    <button class="calc-btn clear" data-action="clear">C</button>
                    <button class="calc-btn backspace" data-action="backspace">⌫</button>
                    <button class="calc-btn operator" data-action="sign">±</button>
                    <button class="calc-btn operator" data-op="/">÷</button>

                    <button class="calc-btn" data-digit="7">7</button>
                    <button class="calc-btn" data-digit="8">8</button>
                    <button class="calc-btn" data-digit="9">9</button>
                    <button class="calc-btn operator" data-op="*">×</button>

                    <button class="calc-btn" data-digit="4">4</button>
                    <button class="calc-btn" data-digit="5">5</button>
                    <button class="calc-btn" data-digit="6">6</button>
                    <button class="calc-btn operator" data-op="-">-</button>

                    <button class="calc-btn" data-digit="1">1</button>
                    <button class="calc-btn" data-digit="2">2</button>
                    <button class="calc-btn" data-digit="3">3</button>
                    <button class="calc-btn operator" data-op="+">+</button>

                    <button class="calc-btn" data-digit="0">0</button>
                    <button class="calc-btn" data-digit=".">.</button>
                    <button class="calc-btn equals" data-action="equals">=</button>
                </div>
            </div>
        `;

        const display = container.querySelector('#calcDisplay');
        // Сброс состояния при открытии
        calcState = {
            current: '0',
            prev: null,
            operation: null,
            waitingForOperand: false
        };
        updateDisplay(display);

        // Назначение обработчиков
        container.querySelectorAll('[data-digit]').forEach(btn => {
            btn.addEventListener('click', () => {
                const digit = btn.getAttribute('data-digit');
                if (digit === '.') inputDecimal(display);
                else inputDigit(digit, display);
            });
        });

        container.querySelectorAll('[data-op]').forEach(btn => {
            btn.addEventListener('click', () => {
                const op = btn.getAttribute('data-op');
                let mappedOp = op;
                if (op === '÷') mappedOp = '/';
                if (op === '×') mappedOp = '*';
                performOperation(mappedOp, display);
            });
        });

        const clearBtn = container.querySelector('[data-action="clear"]');
        if (clearBtn) clearBtn.addEventListener('click', () => clearAll(display));

        const backBtn = container.querySelector('[data-action="backspace"]');
        if (backBtn) backBtn.addEventListener('click', () => backspace(display));

        const signBtn = container.querySelector('[data-action="sign"]');
        if (signBtn) signBtn.addEventListener('click', () => toggleSign(display));

        const equalsBtn = container.querySelector('[data-action="equals"]');
        if (equalsBtn) equalsBtn.addEventListener('click', () => evaluate(display));

        // Клавиатурная поддержка
        const handleKeyDown = (e) => {
            const key = e.key;
            if (/[0-9]/.test(key)) {
                e.preventDefault();
                inputDigit(key, display);
            } else if (key === '.') {
                e.preventDefault();
                inputDecimal(display);
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                e.preventDefault();
                let op = key;
                if (key === '*') op = '*';
                if (key === '/') op = '/';
                performOperation(op, display);
            } else if (key === 'Enter' || key === '=') {
                e.preventDefault();
                evaluate(display);
            } else if (key === 'Escape') {
                e.preventDefault();
                clearAll(display);
            } else if (key === 'Backspace') {
                e.preventDefault();
                backspace(display);
            }
        };
        window.addEventListener('keydown', handleKeyDown);
        // Сохраняем возможность удалить обработчик при уходе с вкладки (опционально)
        // Для простоты оставим, но он будет жить глобально, что не страшно.
        // Можно при перерисовке удалять предыдущий, но не критично.
    }

    function renderCalculator() {
        const contentDiv = document.getElementById('dynamicContent');
        contentDiv.innerHTML = `<div class="section-title">🧮 Калькулятор</div><div id="calculatorRoot"></div>`;
        const calcRoot = document.getElementById('calculatorRoot');
        if (calcRoot) initCalculator(calcRoot);
    }

    // ---------- Остальные разделы ----------
    function renderSection(sectionId) {
        const contentDiv = document.getElementById('dynamicContent');
        if (!contentDiv) return;

        if (sectionId === 'calendar') {
            const now = new Date();
            currentCalendarYear = now.getFullYear();
            currentCalendarMonth = now.getMonth();
            const calendarHtml = `<div class="section-title">📅 Календарь событий</div><div id="calendarRoot" class="calendar-root"></div>`;
            contentDiv.innerHTML = calendarHtml;
            const calendarRoot = document.getElementById('calendarRoot');
            if (calendarRoot) refreshCalendar(calendarRoot);
        }
        else if (sectionId === 'deals') {
            let tableRows = '';
            dealsData.forEach(deal => {
                tableRows += `<tr><td><strong>${deal.name}</strong></td><td>${deal.amount}</td><td><span class="badge">${deal.stage}</span></td><td>${deal.date}</td></tr>`;
            });
            contentDiv.innerHTML = `
                <div class="section-title">💰 Сделки</div>
                <div style="overflow-x: auto;"><table class="data-table"><thead><tr><th>Название сделки</th><th>Сумма</th><th>Стадия</th><th>Дата</th></tr></thead><tbody>${tableRows}</tbody></table></div>
                <div style="margin-top:20px; background:#f9f9fb; padding:16px; border-radius:20px;">📊 Итоговая сумма активных сделок: 2 440 000 ₽</div>
            `;
        }
        else if (sectionId === 'goods') {
            let goodsRows = '';
            goodsData.forEach(item => {
                goodsRows += `<tr><td>${item.name}</td><td>${item.price}</td><td>${item.unit}</td><td>${item.desc}</td></tr>`;
            });
            contentDiv.innerHTML = `
                <div class="section-title">📦 Товары и услуги</div>
                <div style="overflow-x: auto;"><table class="data-table"><thead><tr><th>Наименование</th><th>Цена</th><th>Ед. изм.</th><th>Описание</th></tr></thead><tbody>${goodsRows}</tbody></table></div>
                <div style="margin-top:20px; background:#f1f5fe; border-radius:18px; padding:16px;">⚡ Актуальные предложения для клиентов "Орби"</div>
            `;
        }
        else if (sectionId === 'contacts') {
            let contactsRows = '';
            contactsData.forEach(contact => {
                contactsRows += `<tr><td><strong>${contact.name}</strong></td><td>${contact.position}</td><td>${contact.phone}</td><td>${contact.email}</td></tr>`;
            });
            contentDiv.innerHTML = `
                <div class="section-title">👥 Контакты</div>
                <div style="overflow-x: auto;"><table class="data-table"><thead><tr><th>ФИО</th><th>Должность</th><th>Телефон</th><th>Email</th></tr></thead><tbody>${contactsRows}</tbody></table></div>
                <div style="margin-top:24px; background:#eef2ff; border-radius:20px; padding:16px;">📞 Быстрая связь: общий корпоративный телефон +7 (495) 555-23-23</div>
            `;
        }
        else if (sectionId === 'import') {
            renderImportSection();
        }
        else if (sectionId === 'calculator') {
            renderCalculator();
        }
    }

    // ---------- Управление меню ----------
    let currentSection = 'calendar';
    function setActiveSection(section) {
        currentSection = section;
        renderSection(section);
        closeDropdown();
    }

    const menuBtn = document.getElementById('menuButton');
    const dropdownContent = document.getElementById('dropdownContent');

    function toggleDropdown(e) {
        e?.stopPropagation();
        dropdownContent.classList.toggle('show');
    }
    function closeDropdown() {
        dropdownContent.classList.remove('show');
    }

    document.querySelectorAll('.dropdown-content a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const section = link.getAttribute('data-section');
            if (section === 'calendar') setActiveSection('calendar');
            else if (section === 'deals') setActiveSection('deals');
            else if (section === 'goods') setActiveSection('goods');
            else if (section === 'contacts') setActiveSection('contacts');
            else if (section === 'import') setActiveSection('import');
            else if (section === 'calculator') setActiveSection('calculator');
            else if (section === 'exit') window.location.href = 'https://orbicrm.ru/';
        });
    });

    menuBtn.addEventListener('click', toggleDropdown);
    window.addEventListener('click', function(e) {
        if (!menuBtn.contains(e.target) && !dropdownContent.contains(e.target)) closeDropdown();
    });

    // Часы
    function updateClock() {
        const now = new Date();
        const formatted = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const clockElement = document.getElementById('liveClock');
        if (clockElement) clockElement.textContent = formatted;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Старт
    setActiveSection('calendar');
</script>
</body>
</html>
