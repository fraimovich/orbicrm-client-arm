name: Update Contacts from Supabase

on:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов
  push:
    branches: [ main ]       # или можно по пуше обновлять
  workflow_dispatch:        # кнопка для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Fetch and generate contacts HTML
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node .github/scripts/generate-contacts.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contacts.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update contacts from Supabase"
          git push
